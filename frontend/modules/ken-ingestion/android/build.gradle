plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.keningestion'
version = '0.1.0'

android {
  namespace 'expo.modules.keningestion'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    minSdkVersion 24
  }
}

dependencies {
  // NotificationCompat / ActivityCompat. Declared rather than relied on
  // transitively so the module builds regardless of what else is linked.
  implementation 'androidx.core:core-ktx:1.13.1'
}
