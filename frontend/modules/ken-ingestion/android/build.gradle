// expo-module-gradle-plugin supplies the Android library setup, Kotlin
// configuration and expo-modules-core wiring that every Expo module needs.
// Hand-rolling those drifts from whatever the installed SDK expects.
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.keningestion'
version = '0.1.0'

android {
  namespace 'expo.modules.keningestion'

  defaultConfig {
    minSdkVersion 24
  }
}

dependencies {
  // NotificationCompat / ActivityCompat. Declared rather than relied on
  // transitively so the module builds regardless of what else is linked.
  implementation 'androidx.core:core-ktx:1.13.1'
}
